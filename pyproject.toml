[project]
name = "zhihe-medical-visit-agent"
version = "1.0.0"
description = "Health communication and visit preparation demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "starlette==1.7.0",
    "uvicorn==0.34.2",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "SQLAlchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.fastapi.static]
# Keep the application middleware, CSP and host checks on frontend responses.
cdn = false
