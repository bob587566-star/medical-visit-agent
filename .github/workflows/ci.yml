name: Medical Agent checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medical-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -c backend/requirements.lock.txt
      - run: python scripts/configure_runtime_check.py
      - run: python scripts/configure_runtime_containers.py
      - run: docker compose -p zhihe-engineering-check -f compose.production.yaml up -d --wait --wait-timeout 75 postgres redis
      - name: Real PostgreSQL and Redis integration tests
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          from backend.model import read_project_env
          config = read_project_env(Path('data/runtime-check.env'))
          env = {**os.environ, 'MEDICAL_TEST_DATABASE_URL': config['DATABASE_URL'], 'MEDICAL_TEST_REDIS_URL': config['REDIS_URL']}
          raise SystemExit(subprocess.call([sys.executable, '-m', 'pytest', 'backend/tests/test_postgres_storage.py', 'backend/tests/test_persistent_worker.py', '-q', '--basetemp=.pytest-tmp/ci-shared-runtime'], env=env))
          PY
      - run: python scripts/check_redis_runtime.py
      - if: always()
        run: docker compose -p zhihe-engineering-check -f compose.production.yaml down
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -c backend/requirements.lock.txt
      - run: python scripts/check_repository_secrets.py --history
      - run: python -m pytest backend/tests tests -q --basetemp=.pytest-tmp/ci
      - run: python tests/model_boundary.py
      - name: Dependency audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r backend/requirements.lock.txt --no-deps --disable-pip -f json -o artifacts/dependency-audit-ci-python.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: python-dependency-audit
          path: artifacts/dependency-audit-ci-python.json
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  browser:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt -c backend/requirements.lock.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install msedge
        working-directory: frontend
      - name: Start isolated fictional test service
        shell: pwsh
        run: |
          $env:VISIT_DATA_PATH = Join-Path $env:RUNNER_TEMP 'medical-ci/visits.sqlite3'
          $env:LOCAL_SAFETY_ENABLED = 'false'
          $env:DEEPSEEK_API_KEY = ''
          Start-Process -FilePath python -ArgumentList @('-m', 'uvicorn', 'backend.main:app', '--host', '127.0.0.1', '--port', '8270', '--no-access-log') -WindowStyle Hidden
          $ready = $false
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            try {
              $response = Invoke-WebRequest 'http://127.0.0.1:8270/readyz' -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw 'Isolated service did not become ready.' }
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fictional-browser-failures
          path: frontend/test-results
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -c backend/requirements.lock.txt
      - run: docker compose config --quiet
      - run: docker build -t zhihe-medical-ci -t zhihe-medical-engineering-check:20261013 .
      - name: Readiness smoke in isolated container
        run: |
          docker run -d --name zhihe-medical-ci -p 127.0.0.1:18270:8270 --read-only --tmpfs /tmp --mount type=volume,src=zhihe-medical-ci-data,dst=/app/data --cap-drop ALL --security-opt no-new-privileges zhihe-medical-ci
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18270/readyz > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Prepare isolated private infrastructure fixtures
        run: |
          python scripts/configure_runtime_check.py
          python scripts/configure_runtime_containers.py
      - name: Start non-root API, worker and monitoring
        run: docker compose -p zhihe-container-ci -f compose.production.yaml --profile application up -d --wait --wait-timeout 120 api worker prometheus
      - name: Verify private secret mounts and authenticated monitoring
        run: python deploy/check_application_runtime.py --project zhihe-container-ci
      - name: Remove this runner's isolated containers and fixture volumes
        if: always()
        run: |
          docker compose -p zhihe-container-ci -f compose.production.yaml --profile application down --volumes
          docker rm -f zhihe-medical-ci 2>/dev/null || true
          docker volume rm zhihe-medical-ci-data 2>/dev/null || true
