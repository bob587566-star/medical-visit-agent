# Isolated engineering stack. It is NOT a public production deployment.
# Prepare private local credentials with scripts/configure_runtime_check.py.
services:
  api:
    profiles: ["application"]
    build: .
    image: zhihe-medical-engineering-check:20261013
    ports:
      - "127.0.0.1:8273:8270"
    env_file:
      - ./data/runtime-container.env
    secrets:
      - record_key
      - task_key
    volumes:
      - runtime-application:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  worker:
    profiles: ["application"]
    image: zhihe-medical-engineering-check:20261013
    command: ["python", "-m", "backend.worker"]
    env_file:
      - ./data/runtime-container.env
    environment:
      WORKER_MODE: "true"
    secrets:
      - record_key
      - task_key
    volumes:
      - runtime-application:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      disable: true
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  prometheus:
    profiles: ["application"]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=128MB"]
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - runtime-prometheus:/prometheus
    secrets:
      - metrics_token
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    ports:
      - "127.0.0.1:18432:5432"
    environment:
      POSTGRES_USER: zhihe_fixture
      POSTGRES_DB: medical_fixture
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums
    secrets:
      - postgres_password
    volumes:
      - runtime-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zhihe_fixture", "-d", "medical_fixture"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    image: redis:8.2.10-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    command: ["redis-server", "/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:18379:6379"
    volumes:
      - runtime-redis:/data
      - ./data/runtime-redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(sed -n 's/^requirepass //p' /etc/redis/redis.conf) redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  record_key:
    file: ./data/runtime-profile/data.keys.json
  task_key:
    file: ./data/runtime-profile/tasks.key
  metrics_token:
    file: ./data/runtime-metrics-token.private
  postgres_password:
    file: ./data/runtime-postgres.password
volumes:
  runtime-application:
  runtime-prometheus:
  runtime-postgres:
  runtime-redis:
